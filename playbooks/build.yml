---
- name: Build ceph-ansible image
  hosts: all

  vars:
    python_venv_dir: /tmp/venv

  environment:
    ceph_version: "{{ version_ceph | default('quincy') }}"
    registry: "{{ docker_registry }}"
    repository: "{{ docker_namespace }}/ceph-ansible"
    version: "{{ zuul['tag'] | default('latest') }}"
    COSIGN_PASSWORD: "{{ secret.COSIGN_PASSWORD | default('') }}"
    COSIGN_PRIVATE_KEY: "{{ secret.COSIGN_PRIVATE_KEY | default('') }}"
    DTRACK_SERVER: "https://dtrack.osism.tech"
    DTRACK_API_KEY: "{{ secret.DTRACK_API_KEY | default('') }}"

  tasks:
    - name: Log into registry
      community.docker.docker_login:
        registry_url: "{{ docker_registry }}"
        username: "{{ secret.DOCKER_USERNAME }}"
        password: "{{ secret.DOCKER_PASSWORD }}"
      when: push_image | default(false) | bool
      no_log: true

    - name: Run build script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          revision=$(git rev-parse --short HEAD)
          revision_full=$(git rev-parse HEAD)

          # NOTE: The sources that are fetched while the image is built are
          #       resolved to commits here, so that the image records what it
          #       contains. The commits are passed into the build as well,
          #       which pins them: without that the label and the clone in the
          #       Containerfile are two independent resolutions of a floating
          #       ref and can differ.
          resolve_commit () {
              local url=$1
              local ref=$2
              local refs sha

              # NOTE: An annotated tag resolves to the tag object and not to
              #       a commit, so the commit is requested explicitly as
              #       $ref^{}. That pattern matches nothing for a branch or a
              #       lightweight tag, where $ref is the commit itself.
              refs=$(git ls-remote "$url" "$ref" "$ref^{}")

              sha=$(echo "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
              if [[ -z $sha ]]; then
                  sha=$(echo "$refs" | awk 'NR == 1 { print $1 }')
              fi

              if [[ -z $sha ]]; then
                  echo "unable to resolve $ref in $url" >&2
                  exit 1
              fi

              echo "$sha"
          }

          release_version () {
              echo "$series_yml" | grep "^$1:" | awk -F': ' '{ print $2 }' | tr -d "\"' "
          }

          # NOTE: A release build takes its Ceph series from the release
          #       commit it is built for. latest/ceph_ansible.yml names the
          #       series; snapshots from before it existed name it with
          #       latest/ceph.yml. The release tag is resolved first and every
          #       file is read through that commit, so a tag moved during the
          #       build cannot mix two states.
          if [[ $version != "latest" ]]; then
              sha_release=$(resolve_commit https://github.com/osism/release "refs/tags/ceph-ansible-$version")
              release_url=https://raw.githubusercontent.com/osism/release/$sha_release/latest
              filename=$(curl -fsSL "$release_url/ceph_ansible.yml" 2>/dev/null || curl -fsSL "$release_url/ceph.yml")
              series_yml=$(curl -fsSL "$release_url/$filename")
              ceph_version=$(echo "$series_yml" | grep "ceph_version:" | awk -F': ' '{ print $2 }')
              sha_ansible_playbooks=$(resolve_commit https://github.com/osism/ansible-playbooks "refs/tags/$(release_version playbooks_version)")
              sha_generics=$(resolve_commit https://github.com/osism/generics "refs/tags/$(release_version generics_version)")
          else
              sha_release=$(resolve_commit https://github.com/osism/release HEAD)
              series_yml=$(curl -fsSL "https://raw.githubusercontent.com/osism/release/$sha_release/latest/ceph-$ceph_version.yml")
              sha_ansible_playbooks=$(resolve_commit https://github.com/osism/ansible-playbooks HEAD)
              sha_generics=$(resolve_commit https://github.com/osism/generics HEAD)
          fi

          ceph_ansible_version=$(echo "$series_yml" | grep "ceph_ansible_version:" | awk -F': ' '{ print $2 }')
          sha_ceph_ansible=$(resolve_commit https://github.com/ceph/ceph-ansible "refs/heads/$ceph_ansible_version")

          . defaults/${ceph_version}.sh

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          # NOTE: The base image is pinned by digest the same way.
          base_image=$(awk -F= '$1 == "ARG BASE_IMAGE" { print $2; exit }' Containerfile)
          base_tag=$(awk -F= '$1 == "ARG BASE_TAG" { print $2; exit }' Containerfile)
          if [[ -z $base_image || -z $base_tag ]]; then
              echo "no ARG BASE_IMAGE or BASE_TAG in the Containerfile" >&2
              exit 1
          fi
          base_name=$base_image:$base_tag
          base_digest=sha256:$(docker buildx imagetools inspect --raw "$base_name" | sha256sum | cut -d' ' -f1)

          docker buildx build \
              --build-arg "BASE_TAG=$base_tag@$base_digest" \
              --build-arg "CEPH_VERSION=$ceph_version" \
              --build-arg "SHA_ANSIBLE_PLAYBOOKS=$sha_ansible_playbooks" \
              --build-arg "SHA_CEPH_ANSIBLE=$sha_ceph_ansible" \
              --build-arg "SHA_GENERICS=$sha_generics" \
              --build-arg "SHA_RELEASE=$sha_release" \
              --build-arg "VERSION=$version" \
              --label "org.opencontainers.image.base.digest=$base_digest" \
              --label "org.opencontainers.image.base.name=$base_name" \
              --label "org.opencontainers.image.created=$created" \
              --label "org.opencontainers.image.documentation=https://osism.tech/docs/" \
              --label "org.opencontainers.image.licenses=ASL 2.0" \
              --label "org.opencontainers.image.revision=$revision_full" \
              --label "org.opencontainers.image.source=https://github.com/osism/container-image-ceph-ansible" \
              --label "org.opencontainers.image.title=ceph-ansible" \
              --label "org.opencontainers.image.url=https://quay.io/organization/osism" \
              --label "org.opencontainers.image.vendor=OSISM GmbH" \
              --label "org.opencontainers.image.version=$version" \
              --label "de.osism.commit.ansible_playbooks=$sha_ansible_playbooks" \
              --label "de.osism.commit.ceph_ansible=$sha_ceph_ansible" \
              --label "de.osism.commit.generics=$sha_generics" \
              --label "de.osism.commit.release=$sha_release" \
              --label "de.osism.release.ceph=$ceph_version" \
              --load \
              --tag "$revision" \
              .  # <-- there is a dot
      changed_when: true

    - name: Run push script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          revision=$(git rev-parse --short HEAD)

          {% raw %}
          if [[ $version != "latest" ]]; then
              version="${version:1:${#version}-1}"
          fi
          {% endraw %}

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          if [[ $version == "latest" ]]; then
              tag=$repository:$ceph_version
          else
              tag=$repository:$version
          fi

          docker tag "$revision" "$tag"
          docker push "$tag"
      when: push_image | default(false) | bool
      changed_when: true

    - name: Run cosign script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          {% raw %}
          if [[ $version != "latest" ]]; then
              version="${version:1:${#version}-1}"
          else
              version=$ceph_version
          fi
          {% endraw %}

          curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          chmod +x cosign-linux-amd64
          ./cosign-linux-amd64 sign --yes --key env://COSIGN_PRIVATE_KEY "$repository:$version"
      when: push_sbom | default(false) | bool
      changed_when: true

    - name: Run sbom script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          {% raw %}
          if [[ $version != "latest" ]]; then
              version="${version:1:${#version}-1}"
          else
              version=$ceph_version
          fi
          {% endraw %}

          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          /usr/local/bin/syft scan "$repository:$version" -o cyclonedx-json@1.6 > sbom.json
          {{ python_venv_dir }}/bin/dtrackauditor \
            -p ceph-ansible \
            -v "$version" \
            -f sbom.json \
            -a
      when: push_sbom | default(false) | bool
      changed_when: true
